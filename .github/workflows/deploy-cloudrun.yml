name: Deploy to Cloud Run

on:
  push:
    branches: [master]

env:
  REGION: us-central1
  SERVICE: word-hunt-backend
  REPOSITORY: word-hunt-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${REPOSITORY}/${SERVICE}:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # min-instances=0 + max-instances=1 is deliberate, not just for cost:
      # match/room/matchmaking state lives in the process's memory (see
      # src/socket/state.ts), so more than one live instance would split
      # that state and break gameplay. Scaling to zero when idle is what
      # keeps this basically free at low traffic (Cloud Run's free tier is
      # ~180k vCPU-seconds and ~360k GiB-seconds per month).
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${SERVICE}" \
            --image="${IMAGE}" \
            --region="${REGION}" \
            --platform=managed \
            --allow-unauthenticated \
            --service-account="word-hunt-backend-runtime@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --min-instances=0 \
            --max-instances=1 \
            --cpu=1 \
            --memory=512Mi \
            --concurrency=250 \
            --timeout=3600 \
            --set-env-vars="CORS_ORIGIN=*"

      - name: Print service URL
        run: gcloud run services describe "${SERVICE}" --region="${REGION}" --format='value(status.url)'
