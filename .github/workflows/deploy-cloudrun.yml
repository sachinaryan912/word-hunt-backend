name: Deploy to Cloud Run

on:
  push:
    branches: [master]

env:
  REGION: us-central1
  SERVICE: word-hunt-backend
  REPOSITORY: word-hunt-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${REPOSITORY}/${SERVICE}:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # max-instances=1 is a correctness requirement, not a cost knob: match/
      # room/matchmaking state lives in this process's memory (see
      # src/socket/state.ts) with no Redis or shared store behind it. A
      # second concurrent instance would have its own disconnected copy of
      # that state — matches, queue entries, and room codes created on one
      # instance would be invisible to the other. Keep this at 1 until that
      # state moves to a shared store.
      #
      # min-instances=1 is a deliberate cost/reliability trade-off (chosen
      # over the cheaper min-instances=0 default) to avoid cold-start delays
      # on Socket.IO connections; it keeps one instance warm continuously.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${SERVICE}" \
            --image="${IMAGE}" \
            --region="${REGION}" \
            --platform=managed \
            --allow-unauthenticated \
            --service-account="word-hunt-backend-runtime@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --min-instances=1 \
            --max-instances=1 \
            --cpu=1 \
            --memory=512Mi \
            --concurrency=250 \
            --timeout=3600 \
            --set-env-vars="CORS_ORIGIN=*"

      - name: Print service URL
        run: gcloud run services describe "${SERVICE}" --region="${REGION}" --format='value(status.url)'
